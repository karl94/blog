# Lancement en une commande :  docker compose up
# Web : http://localhost:5173   API : http://localhost:4000/api/sante
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: suivo
      POSTGRES_PASSWORD: suivo
      POSTGRES_DB: suivo
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suivo"]
      interval: 3s
      retries: 20

  api:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./backend:/app"]
    environment:
      DATABASE_URL: postgres://suivo:suivo@db:5432/suivo
      JWT_SECRET: change-me-en-production
      DEMO_MODE: "true"
      PUBLIC_URL: http://localhost:5173
    command: sh -c "npm install --no-audit --no-fund && npm run db:init && npm start"
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    environment:
      API_URL: http://api:4000
    command: sh -c "npm install --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5173"
    ports: ["5173:5173"]
    depends_on: [api]
